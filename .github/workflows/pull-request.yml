name: Pull Request

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - "**"

permissions:
  contents: read
  deployments: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/master' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Run linter
        run: npm run lint

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/master' }}
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Run unit tests with coverage
        run: npm test -- --coverage

      - name: Upload unit test coverage
        uses: actions/upload-artifact@v6
        with:
          name: unit-coverage
          path: coverage
          if-no-files-found: error

  e2e-tests:
    name: E2E tests
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/master' }}
    needs: lint
    environment: integration
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload E2E coverage and reports
        uses: actions/upload-artifact@v6
        with:
          name: e2e-coverage
          path: |
            coverage
            playwright-report
            test-results
          if-no-files-found: warn

  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs:
      - lint
      - unit-tests
      - e2e-tests
    if: ${{ github.event_name == 'push' && needs.lint.result == 'success' && needs.unit-tests.result == 'success' && needs.e2e-tests.result == 'success' }}
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}

  status-comment:
    name: Status comment
    runs-on: ubuntu-latest
    needs: deploy
    if: ${{ github.event_name == 'push' && needs.deploy.result == 'success' }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Comment on PR with status
        uses: actions/github-script@v8
        with:
          script: |
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const body = [
              "✅ Lint, unit tests, and E2E tests passed.",
              "",
              `Run: ${runUrl}`,
            ].join("\n");

            const { owner, repo } = context.repo;
            let issueNumber = context.payload.pull_request?.number;

            if (!issueNumber) {
              const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner,
                repo,
                commit_sha: context.sha,
              });

              issueNumber = prs?.[0]?.number;
            }

            if (!issueNumber) {
              core.info("No PR found for this commit. Skipping status comment.");
              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issueNumber,
              body,
            });
